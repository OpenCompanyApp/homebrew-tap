name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Cache GMP source for Intel lint tools
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          set -euo pipefail
          gmp_metadata=$(brew info --json=v2 gmp)
          gmp_url=$(jq -r '.formulae[0].urls.stable.url' <<< "$gmp_metadata")
          gmp_sha256=$(jq -r '.formulae[0].urls.stable.checksum' <<< "$gmp_metadata")
          gmp_archive=${gmp_url##*/}
          [[ "$gmp_archive" =~ ^gmp-[0-9][0-9.]*\.tar\.(xz|bz2|gz)$ ]]
          [[ "$gmp_sha256" =~ ^[0-9a-f]{64}$ ]]
          gmp_cache=$(brew --cache --build-from-source gmp)
          mkdir -p "$(dirname "$gmp_cache")"
          gmp_download=$(mktemp "${gmp_cache}.XXXXXX")
          trap 'rm -f "$gmp_download"' EXIT
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "https://ftp.gnu.org/gnu/gmp/$gmp_archive" --output "$gmp_download"
          printf '%s  %s\n' "$gmp_sha256" "$gmp_download" | shasum -a 256 --check -
          mv "$gmp_download" "$gmp_cache"

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
